<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Biscuits Internet Project · Back soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: hsl(240 10% 3.9%);
      color: hsl(240 5% 82%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 32rem;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      background: hsl(240 6% 10%);
      border: 1px solid hsl(240 6% 18%);
      border-radius: 0.75rem;
      box-shadow: 0 0 60px hsl(263 85% 60% / 0.15);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.6rem;
      line-height: 1.25;
      color: hsl(267 90% 70%);
    }
    p { margin: 0 0 0.75rem; }
    .lead { color: hsl(0 0% 98%); font-size: 1.1rem; }
    .message { color: hsl(145 80% 55%); }
    .message:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Biscuits Internet Project</h1>
    <p class="lead">We're moving the database to a new home.</p>
    <p>The site will be back in a few minutes.</p>
    <p class="message">{{ .Message }}</p>
  </main>
</body>
</html>
