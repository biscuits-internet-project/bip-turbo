service: bip-web
image: doncote/bip-web

# Boot runs migrations plus the stats and ratings recomputes before the server
# listens, so a new container serves fresh caches from its first request. That
# costs ~12-16s normally and ~22s when a migration enqueues a full-catalog stats
# recompute (2026-07-15 deploy). Kamal's 30s default left no room for the latter.
# The old container keeps serving until the new one is healthy, so a longer
# budget is only a ceiling on how long a genuinely broken boot takes to fail.
deploy_timeout: 120

servers:
  web:
    hosts:
      - 5.161.124.129
    options:
      # Contain app memory growth: the 3.7GB no-swap host freezes for ~30min
      # when any process exhausts RAM (2026-07-14 outage). Under a limit,
      # docker OOM-kills just the app and the restart policy revives it in
      # seconds. Headroom: redis is capped at 512mb, postgres/proxy/other
      # tenants use roughly another 1gb.
      memory: 1536m

proxy:
  ssl: true
  host: discobiscuits.net
  app_port: 8080
  response_timeout: 30
  # Cap request bodies at the proxy. Every action fully buffers its body before
  # inspecting it, and the container has a hard 1536m ceiling, so without this a
  # single large POST OOM-kills the app. 12MB clears the largest legitimate upload
  # (MAX_IMAGE_FILE_SIZE is 10MB) plus the multipart envelope.
  buffering:
    max_request_body: 12000000
  healthcheck:
    path: /healthcheck
    # Probe often enough that a container is promoted as soon as it listens.
    # At a 10s interval the 2026-07-15 deploy went healthy at 22.3s but was
    # only probed at 20s and 30s, so it was declared unhealthy despite booting
    # inside the budget. /healthcheck is a static 200 with no DB dependency.
    interval: 3
    timeout: 2

registry:
  username: doncote
  password:
    - DOCKER_PASSWORD

env:
  secret:
    - BASE_URL
    - SUPABASE_URL
    - SUPABASE_ANON_KEY
    - SUPABASE_SERVICE_ROLE_KEY
    - SUPABASE_STORAGE_URL
    - OPENAI_API_KEY
    - RESEND_API_KEY
    - CONTACT_EMAIL
    - HONEYBADGER_API_KEY
    - CLOUDFLARE_ACCOUNT_ID
    - CLOUDFLARE_IMAGES_API_TOKEN
    - CLOUDFLARE_ZONE_ID
    - CLOUDFLARE_CACHE_PURGE_TOKEN
    - DATABASE_URL
    - ADMIN_API_KEY
    # Raised rate limits for specific API keys, OAuth apps or users (JSON; "{}" for none).
    - RATE_LIMIT_OVERRIDES
  clear:
    APP_ENV: production
    PORT: "8080"
    # Container-name DNS on the kamal Docker network; accessory IPs change on
    # restart, so never point this at a raw container IP.
    REDIS_URL: redis://bip-web-redis:6379

# Served by kamal-proxy during `kamal app maintenance`. Kamal copies these from
# the repo to the host on every deploy.
error_pages_path: config/error_pages

builder:
  arch: amd64
  local: true
  dockerfile: apps/web/Dockerfile

ssh:
  user: deploy

accessories:
  redis:
    image: redis:7-alpine
    host: 5.161.124.129
    port: "127.0.0.1:6379:6379"
    directories:
      - bip-web-redis-data:/data
    # Cap memory and evict LRU: everything cached is rebuildable, and an
    # uncapped redis grows until the kernel OOM-kills it (2026-07-07 outage).
    cmd: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  postgres:
    # pgvector adds the vector extension the search embeddings need; pg_trgm and
    # unaccent ship with Postgres.
    image: pgvector/pgvector:pg18
    host: 5.161.124.129
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: bip
        POSTGRES_DB: bip
      secret:
        - POSTGRES_PASSWORD
    # PG 18 images keep data in /var/lib/postgresql/18/docker. Mounting the old
    # /var/lib/postgresql/data path left the real data in an anonymous volume
    # that a container recreate would orphan, so mount the parent instead.
    volumes:
      - bip-web-postgres-data:/var/lib/postgresql
    # Same reasoning as the web cap: on this shared 3.7GB host, a runaway
    # postgres should be OOM-killed and restarted, not freeze the box.
    # pg_stat_statements records per-query timings for the Grafana dashboard.
    cmd: postgres -c shared_buffers=256MB -c max_connections=50 -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=top
    options:
      shm-size: 256m
      memory: 768m

  alloy:
    # Grafana Alloy ships host, container, Postgres and Redis metrics plus
    # container and backup logs to Grafana Cloud. Config: config/alloy/config.alloy.
    # The token can only write metrics and logs (no read, no admin).
    image: grafana/alloy:v1.21.3
    host: 5.161.124.129
    env:
      secret:
        - GRAFANA_CLOUD_TOKEN
        - POSTGRES_PASSWORD
    files:
      - config/alloy/config.alloy:/etc/alloy/config.alloy
    volumes:
      # Docker socket: container discovery and logs. Read-only host mounts:
      # host metrics (/proc, /sys, /), per-container stats, backup logs.
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /home/deploy/backups:/host/backups:ro
      - bip-web-alloy-data:/var/lib/alloy/data
    cmd: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    options:
      memory: 384m
      # Metrics carry the container hostname as `instance`; a fixed one keeps a
      # single series per metric across restarts.
      hostname: bip-alloy
