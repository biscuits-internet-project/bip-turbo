name: Cron Jobs

on:
  # Manual trigger with job selection
  workflow_dispatch:
    inputs:
      job:
        description: 'Cron job to run'
        required: true
        default: 'recompute-ratings'
        type: choice
        options:
          - recompute-ratings
          - detect-duplicate-accounts
      timeout:
        description: 'Timeout in minutes'
        required: false
        default: '10'
        type: string
  
  # Scheduled triggers. Each cron expression maps to one job below, so adding a
  # schedule means adding its expression to that mapping too. Minutes are off the
  # top of the hour because GitHub drops scheduled runs under load, and :00 is
  # when load peaks.
  schedule:
    # Run the ratings recompute every hour (dirty-gated server-side, so it's
    # a cheap no-op when no ratings changed)
    - cron: '17 * * * *'
    # Look for duplicate rater accounts weekly, Mondays at 09:23 UTC. Signups are
    # rare and the findings are read by hand, so daily would just be churn.
    - cron: '23 9 * * 1'

env:
  PRODUCTION_URL: 'https://discobiscuits.net'

# Least privilege: nothing here writes to the repo, so a compromised step gets a
# read-only token instead of the repo's default write token.
permissions:
  contents: read

jobs:
  cron-job:
    name: Run Cron Job
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout || '10') }}
    
    steps:
      # GitHub fires one run per matching cron expression and passes that
      # expression as github.event.schedule, which picks the job here.
      - name: Set job from schedule
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "23 9 * * 1") job=detect-duplicate-accounts ;;
            *)           job=recompute-ratings ;;
          esac
          echo "CRON_JOB=$job" >> $GITHUB_ENV

      - name: Set job from manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: echo "CRON_JOB=${{ github.event.inputs.job }}" >> $GITHUB_ENV
      
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Run cron job
        # The key is read from Doppler at run time rather than duplicated as a GitHub
        # secret, so bip/prd_hetzner stays the single source of truth: rotating it there
        # is enough, with no second copy to drift out of sync. Same DOPPLER_TOKEN the
        # deploy workflow already uses to reach that config.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          echo "Running cron job: $CRON_JOB"
          echo "Timeout: ${{ github.event.inputs.timeout || '10' }} minutes"

          ADMIN_API_KEY=$(doppler secrets get ADMIN_API_KEY --project bip --config prd_hetzner --plain)

          if [ -z "$ADMIN_API_KEY" ]; then
            echo "❌ ADMIN_API_KEY is not set in bip/prd_hetzner; cron requests would be rejected."
            exit 1
          fi

          # Register with the runner's log scrubber before the value is used anywhere.
          echo "::add-mask::$ADMIN_API_KEY"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ env.PRODUCTION_URL }}/api/cron/$CRON_JOB" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            --max-time $((${{ github.event.inputs.timeout || '10' }} * 60)))
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Cron job completed successfully"
            echo "$body" | jq '.' || echo "$body"
          else
            echo "❌ Cron job failed with status $http_code"
            echo "$body" | jq '.' || echo "$body"
            exit 1
          fi

