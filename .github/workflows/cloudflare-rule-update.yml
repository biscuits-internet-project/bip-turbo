# Sets one live Cloudflare rule's expression to the one in ops/cloudflare/*-rules.json,
# leaving every other rule alone (see update_rule.py for the checks it makes).
#
# Two manual runs, from main only, since each one holds the token. First run it with
# mode dry-run: it only reads, and prints the old and new expression and an approval
# code. Then run it with mode apply and that approval_code: starting that run is the
# approval, and it refuses if Cloudflare or the repo's rule changed since the dry run.
name: Cloudflare Rule Update
on:
  workflow_dispatch:
    inputs:
      rule_ref:
        description: "ref of the rule to update, as in ops/cloudflare/*-rules.json"
        required: true
        type: string
      mode:
        description: "dry-run only reads; apply sends the update"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      approval_code:
        description: "for apply: the code the dry run printed"
        required: false
        type: string

concurrency:
  group: cloudflare-rule-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Rule update (${{ inputs.mode }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3
      - name: Compare the live rule with the repo, and update it in apply mode
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          RULE_REF: ${{ inputs.rule_ref }}
          MODE: ${{ inputs.mode }}
          APPROVAL_CODE: ${{ inputs.approval_code }}
        run: >-
          ops/cloudflare/with-secrets.sh python3 ops/cloudflare/update_rule.py
          --ref "$RULE_REF" --mode "$MODE" --approval-code "$APPROVAL_CODE"
